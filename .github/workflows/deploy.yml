name: Deploy Pierre Web3 Harness to Tencent Lighthouse VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web3-harness
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web3-harness/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

      - name: Check deploy secrets are set
        working-directory: .
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          for v in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v belum diisi (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done

      - name: Deploy to Tencent Cloud Lighthouse via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            # Pakai node dari nvm lewat PATH langsung (nvm.sh bentrok dengan prefix di ~/.npmrc)
            NODE_BIN="$(ls -d "$HOME"/.nvm/versions/node/*/bin 2>/dev/null | sort -V | tail -1)"
            export PATH="$NODE_BIN:$HOME/.npm-global/bin:$HOME/.local/bin:$PATH"
            node -v && npm -v

            SRC="$HOME/.hermes/deploy-src"
            DEST="$HOME/.hermes/web3-harness"

            # Deploy source: clone terpisah (repo public), tidak menyentuh ~/pierre-repo
            if [ ! -d "$SRC/.git" ]; then
              git clone --depth 1 https://github.com/${{ github.repository }}.git "$SRC"
            fi
            git -C "$SRC" fetch --depth 1 origin main
            git -C "$SRC" reset --hard origin/main

            # Sync kode. Tanpa --delete, dan DB/.env/node_modules tidak disentuh.
            mkdir -p "$DEST"
            rsync -a \
              --exclude '.env' --exclude '*.db' --exclude '*.db-shm' --exclude '*.db-wal' \
              --exclude 'node_modules' \
              "$SRC/web3-harness/" "$DEST/"

            cd "$DEST"
            npm ci --omit=dev

            # Sync switch_model.py & update fallback_providers in ~/.hermes/config.yaml
            mkdir -p "$HOME/.hermes/scripts"
            cp -f "$DEST/hermes-templates/scripts/switch_model.py" "$HOME/.hermes/scripts/" 2>/dev/null || true
            chmod +x "$HOME/.hermes/scripts/switch_model.py" 2>/dev/null || true
            python3 "$DEST/hermes-templates/scripts/switch_model.py" claude openrouter || cp -f "$DEST/hermes-templates/config.yaml" "$HOME/.hermes/config.yaml"

            echo "== restart services =="
            # Restart hanya proses pm2 yang memang sudah terdaftar.
            # hermes-discord sengaja TIDAK disentuh: gateway jalan via systemd (hermes-gateway.service).
            for app in price-watcher baw-keepalive; do
              if grep -q "\"name\":\"$app\"" "$HOME/.pm2/dump.pm2" 2>/dev/null; then
                pm2 restart "$app" || echo "restart $app gagal"
              else
                echo "pm2 app $app belum terdaftar, dilewati"
              fi
            done
            echo "== deploy selesai =="
