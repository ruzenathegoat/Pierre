name: Deploy Pierre Web3 Harness to Tencent Lighthouse VPS

on:
  push:
    branches:
      - main

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Typecheck
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit

      - name: Deploy to Tencent Cloud Lighthouse via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -f "$HOME/.local/bin/env" ] && source "$HOME/.local/bin/env"
            cd ~/.hermes/web3-harness
            cp known_patterns.json /tmp/known_patterns.backup.json || true
            git fetch origin main
            git reset --hard origin/main
            if [ -f /tmp/known_patterns.backup.json ]; then
              node -e '
                const fs = require("fs");
                const repo = JSON.parse(fs.readFileSync("known_patterns.json", "utf8"));
                const bak = JSON.parse(fs.readFileSync("/tmp/known_patterns.backup.json", "utf8"));
                repo.domains = Array.from(new Set([...repo.domains, ...(bak.domains || [])]));
                repo.selectors = Array.from(new Set([...repo.selectors, ...(bak.selectors || [])]));
                fs.writeFileSync("known_patterns.json", JSON.stringify(repo, null, 2));
              '
            fi
            npm ci --omit=dev
            pm2 restart price-watcher || pm2 start ecosystem.config.cjs --only price-watcher
            pm2 restart baw-keepalive || pm2 start ecosystem.config.cjs --only baw-keepalive
            pm2 restart hermes-discord || pm2 start ecosystem.config.cjs --only hermes-discord
            pm2 save

