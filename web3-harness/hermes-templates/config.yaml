  default: claude-sonnet-5-5[1m]
  base_url: process://claude-subscription-directsdk-experimental
  api_mode: chat_completions
mcp_servers:
  viem_web3_harness:
    command: /home/ubuntu/.nvm/versions/node/v22.23.4/bin/tsx
    args:
      - /home/ubuntu/.hermes/web3-harness/src/mcp-server.ts
