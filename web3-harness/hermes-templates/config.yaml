    model: deepseek/deepseek-v4.1-flash
    base_url: https://openrouter.ai/api/v1
    api_mode: chat_completions
providers:
  openrouter:
    request_timeout_seconds: 60
    stale_timeout_seconds: 60
plugins:
  enabled:
    - claude-subscription-directsdk-experimental
  disabled: []
